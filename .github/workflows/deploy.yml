name: Deploy to Streamlit Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy to Streamlit Cloud
        uses: actions-cool/deploy-streamlit@v1.2
        with:
          space-name: 'topdf'
          app-path: 'app.py'
          token: ${{ secrets.STREAMLIT_CLOUD_TOKEN }}
